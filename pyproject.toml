[project]
name = "projectmind-mcp"
version = "0.9.0"
description = "Give your AI coding assistant a brain: persistent memory, hybrid code search, AI-authored annotations, and an AST symbol graph — 100% local MCP server, no API keys."
authors = [
    {name = "Mykola Riabokon"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = ["mcp", "model-context-protocol", "code-search", "claude", "ai-memory", "bm25", "symbol-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
# Core install is lightweight: BM25 + annotations + symbol graph + memory.
# The embedding/vector stack is the optional [vector] extra.
dependencies = [
    "mcp>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "GitPython>=3.1.0",
    "radon>=6.0.0",
    "pylint>=3.0.0",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-ruby>=0.23.0",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
vector = [
    "chromadb>=1.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.26,<2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/Nik0lay1/project-mind-mcp"
Repository = "https://github.com/Nik0lay1/project-mind-mcp"
Changelog = "https://github.com/Nik0lay1/project-mind-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/Nik0lay1/project-mind-mcp/issues"

[project.scripts]
projectmind-mcp = "mcp_server:main"
projectmind = "mcp_server:main"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "mcp_server",
    "annotations",
    "ast_splitter",
    "background_indexer",
    "bm25_index",
    "config",
    "logger",
    "cache_manager",
    "maintenance",
    "manifest",
    "query_router",
    "symbol_graph",
    "vector_store_manager",
    "memory_manager",
    "codebase_indexer",
    "incremental_indexing",
    "memory_limited_indexer",
    "exceptions",
    "git_utils",
    "context",
    "code_intelligence",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501", "C901"]  # Line too long, complexity

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "sentence_transformers.*",
    "langchain_text_splitters.*",
    "git.*",
    "mcp.*",
]
ignore_missing_imports = true

# numpy 2.x ships stubs using the `type` statement, which mypy rejects under
# python_version = "3.10" — don't analyze numpy at all (it's transitive only).
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "ast_splitter",
    "vector_store_manager",
    "code_intelligence",
    "codebase_indexer",
    "bm25_index",
    "cache_manager",
    "symbol_graph",
    "background_indexer",
    "manifest",
    "maintenance",
    "query_router",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing"
timeout = 30
timeout_method = "thread"
markers = [
    "integration: tests that require ML model loading and real vector store (slow)",
]

[tool.coverage.run]
# Only non-product files are excluded: hiding big modules from the report made
# the coverage number look healthy while the core was untested.
omit = [
    "tests/*",
    "_smoke.py",
    "_run_ci_tests.py",
    "test_import.py",
    "run_index.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
